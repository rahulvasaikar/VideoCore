[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "videocore"
version = "0.1.0"
description = "Modular video processing toolkit starting with multi-video joining."
authors = [{ name = "VideoCore Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "imageio-ffmpeg>=0.5.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "onnxruntime-directml>=1.15.0; sys_platform == 'win32'",
    "onnxruntime>=1.15.0; sys_platform != 'win32'",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "streamlit>=1.30.0",
]

[project.scripts]
videocore = "videocore.cli:main"

[tool.setuptools.packages.find]
include = ["videocore*"]
